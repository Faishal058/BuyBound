name: CI
on:
  push:
  pull_request:
jobs:
  documentation-and-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate JSON schema syntax
        run: python -m json.tool contracts/guardian-policy.schema.json > /dev/null
      - name: Check required safety docs
        run: |
          test -f AGENTS.md
          test -f docs/PRD.md
          test -f docs/ARCHITECTURE.md
          test -f docs/PAYMENT_FLOW.md
          test -f docs/THREAT_MODEL.md
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install validators
        run: pip install openapi-spec-validator
      - name: Validate OpenAPI document
        run: openapi-spec-validator contracts/openapi.yaml
      - name: Check contract completeness (exact-parameter binding)
        run: |
          python - <<'PYEOF'
          import sys
          import yaml

          with open('contracts/openapi.yaml') as f:
              spec = yaml.safe_load(f)

          paths = spec['paths']
          schemas = spec['components']['schemas']

          def check(cond, msg):
              if not cond:
                  print('CONTRACT CHECK FAILED: ' + msg)
                  sys.exit(1)

          # Guardian decision must be queryable per intent
          check('/api/purchase-intents/{intentId}/guardian-decision' in paths,
                'missing /api/purchase-intents/{intentId}/guardian-decision endpoint')

          # GuardianDecision must carry the full approval binding
          gd = schemas.get('GuardianDecision', {})
          gd_props = gd.get('properties', {})
          check(gd_props.get('decision', {}).get('enum') == ['ALLOW', 'HOLD', 'BLOCK'],
                'GuardianDecision.decision enum must be exactly [ALLOW, HOLD, BLOCK]')
          for field in ['mandateId', 'mandateVersion', 'reasonCodes', 'policyVersion',
                        'evidenceHash', 'evaluatedAt', 'expiresAt']:
              check(field in gd_props, 'GuardianDecision missing property ' + field)

          # PurchaseIntent must require the binding fields (fail closed by contract)
          pi_req = schemas.get('PurchaseIntent', {}).get('required', [])
          for field in ['mandateId', 'mandateVersion', 'merchantId', 'currency',
                        'quantity', 'maxTotal', 'idempotencyKey']:
              check(field in pi_req, 'PurchaseIntent.required missing ' + field)

          # Mandate must be versioned and carry policy controls
          m_req = schemas.get('Mandate', {}).get('required', [])
          for field in ['version', 'allowedMerchantIds', 'newMerchantBehavior',
                        'offerMaxAgeSeconds', 'maxPurchasesPerDay']:
              check(field in m_req, 'Mandate.required missing ' + field)

          # Audit listing must be filterable for investigations
          audit_params = [p.get('name') for p in
                          paths['/api/audit-events']['get'].get('parameters', [])]
          for param in ['eventType', 'correlationId']:
              check(param in audit_params, '/api/audit-events missing query param ' + param)

          print('Contract completeness checks passed.')
          PYEOF
  backend:
    # Activates automatically once the Spring Boot application exists.
    if: hashFiles('backend/pom.xml') != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Build and test
        run: mvn -B -f backend/pom.xml verify
