server:
  port: ${PORT:8080}

spring:
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/buybound}
    username: ${DATABASE_USERNAME:buybound}
    password: ${DATABASE_PASSWORD:change_me_locally}
    hikari:
      maximum-pool-size: 10
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  frontend-url: ${APP_FRONTEND_URL:http://localhost:5173}
  payments:
    mode: ${PAYPAL_MODE:${PAYMENTS_MODE:sandbox}}
  discovery:
    mode: ${DISCOVERY_MODE:channel3}
  channel3:
    api-key: ${CHANNEL3_API_KEY:}
    base-url: ${CHANNEL3_BASE_URL:https://api.trychannel3.com/v1}
  ai:
    provider: ${AI_PROVIDER:${LLM_PROVIDER:groq}}
    api-key: ${AI_API_KEY:${LLM_API_KEY:}}
    model: ${AI_MODEL:${LLM_MODEL:openai/gpt-oss-120b}}
    base-url: ${AI_BASE_URL:https://api.groq.com/openai/v1}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:${APP_CORS_ORIGINS:http://localhost:5173,http://localhost:3000}}
  paypal:
    base-url: ${PAYPAL_BASE_URL:https://api-m.sandbox.paypal.com}
    client-id: ${PAYPAL_CLIENT_ID:}
    client-secret: ${PAYPAL_CLIENT_SECRET:}
    webhook-id: ${PAYPAL_WEBHOOK_ID:}

buybound:
  poller:
    enabled: ${BUYBOUND_POLLER_ENABLED:true}
    interval-ms: ${BUYBOUND_POLLER_INTERVAL_MS:60000}

logging:
  level:
    com.buybound: INFO
    org.hibernate.SQL: WARN
