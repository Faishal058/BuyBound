# Local development overrides. Activate with SPRING_PROFILES_ACTIVE=local.
spring:
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    com.buybound: DEBUG
