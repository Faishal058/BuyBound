databases:
  - name: buybound-db
    databaseName: buybound
    user: buybound
    plan: free
    postgresMajorVersion: '16'

services:
  - type: web
    name: buybound-backend
    runtime: docker
    plan: free
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: '8080'
      - key: SPRING_PROFILES_ACTIVE
        value: default
      - key: DATABASE_URL
        fromDatabase:
          name: buybound-db
          property: connectionString
      - key: PAYPAL_MODE
        value: sandbox
      - key: PAYMENTS_MODE
        value: sandbox
      - key: PAYPAL_BASE_URL
        value: https://api-m.sandbox.paypal.com
      - key: DISCOVERY_MODE
        value: channel3
      - key: CHANNEL3_BASE_URL
        value: https://api.trychannel3.com/v1
      - key: AI_PROVIDER
        value: groq
      - key: AI_MODEL
        value: openai/gpt-oss-120b
      - key: AI_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: FRONTEND_URL
        fromService:
          type: web
          name: buybound-frontend
          property: host
      - key: ALLOWED_ORIGINS
        fromService:
          type: web
          name: buybound-frontend
          property: host
      - key: BUYBOUND_POLLER_ENABLED
        value: 'true'
      - key: CHANNEL3_API_KEY
        sync: false
      - key: AI_API_KEY
        sync: false
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false

  - type: web
    name: buybound-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: buybound-backend
          property: host

  - type: workflow
    name: buybound-workflows
    runtime: node
    rootDir: workflows
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: BACKEND_URL
        fromService:
          type: web
          name: buybound-backend
          property: host
      - key: CHANNEL3_BASE_URL
        value: https://api.trychannel3.com/v1
      - key: CHANNEL3_API_KEY
        sync: false
      - key: AI_API_KEY
        sync: false
      - key: RENDER_API_KEY
        sync: false
