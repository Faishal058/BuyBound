databases:
  - name: buybound-db
    databaseName: buybound
    user: buybound
    plan: free
    postgresMajorVersion: '16'

services:
  - type: web
    name: buybound-backend
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: default
      - key: DATABASE_URL
        fromDatabase:
          name: buybound-db
          property: connectionString
      - key: PAYPAL_MODE
        value: sandbox
      - key: DISCOVERY_MODE
        value: channel3
      - key: AI_PROVIDER
        value: groq
      - key: AI_MODEL
        value: openai/gpt-oss-120b
      - key: APP_FRONTEND_URL
        fromService:
          type: web
          name: buybound-frontend
          property: host
      - key: CORS_ALLOWED_ORIGINS
        fromService:
          type: web
          name: buybound-frontend
          property: host
      - key: BUYBOUND_POLLER_ENABLED
        value: 'true'
      - key: CHANNEL3_API_KEY
        sync: false
      - key: AI_API_KEY
        sync: false
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false

  - type: web
    name: buybound-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: buybound-backend
          property: host

